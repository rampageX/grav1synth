name: Formalize grav1synth v0.2.2 source

on:
  push:
    branches:
      - release/0.2.2

permissions:
  contents: write

concurrency:
  group: formalize-v0.2.2
  cancel-in-progress: true

jobs:
  formalize:
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'github-actions[bot]' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply validated SFE source patch
        run: |
          test -f .github/patches/nvenc-sfe-tile-group.patch
          git apply --check .github/patches/nvenc-sfe-tile-group.patch
          git apply .github/patches/nvenc-sfe-tile-group.patch

      - name: Bump package version to 0.2.2
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          cargo = Path('Cargo.toml')
          text = cargo.read_text()
          old = 'version = "0.2.0"'
          if text.count(old) < 1:
              raise SystemExit('Cargo.toml package version anchor not found')
          text = text.replace(old, 'version = "0.2.2"', 1)
          cargo.write_text(text)

          lock = Path('Cargo.lock')
          text = lock.read_text()
          pattern = re.compile(r'(\[\[package\]\]\nname = "grav1synth"\nversion = ")0\.2\.0("\n)')
          text, count = pattern.subn(r'\g<1>0.2.2\2', text, count=1)
          if count != 1:
              raise SystemExit(f'Cargo.lock grav1synth version anchor expected once, found {count}')
          lock.write_text(text)
          PY

      - name: Remove temporary patch build mechanism
        run: |
          git rm .github/patches/nvenc-sfe-tile-group.patch
          git rm .github/workflows/build-grav1synth-windows-fork-patched.yml
          git rm .github/workflows/formalize-v0.2.2.yml

      - name: Verify clean formal source
        run: |
          grep -q 'version = "0.2.2"' Cargo.toml
          grep -q 'Parsing standalone tile group' src/parser/obu.rs
          grep -q 'write_film_grain_bits_with_trailing' src/parser/frame.rs
          if grep -R "nvenc-sfe-tile-group.patch" -n .github src Cargo.toml Cargo.lock 2>/dev/null; then
            echo 'Temporary patch reference still present.'
            exit 1
          fi
          git diff --check
          git status --short

      - name: Commit formal v0.2.2 source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/parser/obu.rs src/parser/frame.rs Cargo.toml Cargo.lock .github/workflows/release.yml
          git commit -m 'release: grav1synth 0.2.2'
          git push origin HEAD:release/0.2.2
